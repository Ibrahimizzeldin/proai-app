<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROAI - Dog Merge Game</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <!-- TON Connect UI SDK -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #f59e0b;
      --accent-hover: #d97706;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --green-color: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      padding-bottom: 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header Balances */
    .header-card {
      width: 100%;
      max-width: 420px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(245, 158, 11, 0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 16px;
    }

    .balance-box {
      display: flex;
      flex-direction: column;
    }

    .balance-title {
      font-size: 13px;
      color: var(--text-muted);
    }

    .balance-amount {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .income-amount {
      font-size: 14px;
      color: var(--green-color);
      font-weight: bold;
    }

    /* Tabs Container */
    .tab-content {
      display: none;
      width: 100%;
      max-width: 420px;
    }

    .tab-content.active {
      display: block;
    }

    /* Grid Area */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      margin-bottom: 20px;
    }

    .grid-slot {
      aspect-ratio: 1;
      background-color: var(--card-bg);
      border: 2px dashed rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }

    .grid-slot.selected {
      border-color: var(--accent-color);
      background-color: rgba(245, 158, 11, 0.15);
      transform: scale(1.03);
    }

    .dog-icon {
      font-size: 42px;
      line-height: 1;
    }

    .dog-level {
      position: absolute;
      bottom: 6px;
      background: var(--accent-color);
      color: #000;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* Actions & Controls */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-buy {
      background-color: var(--accent-color);
      color: #000;
    }

    .btn-ad {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
    }

    .btn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* Cards */
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: #1e293b;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 100;
    }

    .nav-item {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 8px;
    }

    .nav-item.active {
      color: var(--accent-color);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-color);
      color: #000;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      display: none;
      z-index: 1000;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- Top Balance Header -->
  <div class="header-card">
    <div class="balance-box">
      <span class="balance-title">الذهب 🪙</span>
      <span class="balance-amount" id="coin-balance">0</span>
    </div>
    <div class="balance-box" style="text-align: left;">
      <span class="balance-title">الأرباح التلقائية ⚡</span>
      <span class="income-amount" id="sec-income">+0/ثانية</span>
    </div>
  </div>

  <!-- TAB 1: GAME (DOG MERGE) -->
  <div id="tab-game" class="tab-content active">
    <!-- Grid Slots -->
    <div class="grid-container" id="grid">
      <!-- 9 Slots dynamically created -->
    </div>

    <!-- Actions -->
    <div class="controls-container">
      <button class="btn btn-buy" onclick="buyDog()">
        شراء كلب 🐶 (<span id="buy-price">50</span> 🪙)
      </button>
      <button class="btn btn-ad" onclick="watchAdForCoins()">
        مكافأة إعلانية 🎬 (+500 🪙)
      </button>
    </div>
  </div>

  <!-- TAB 2: REWARDS / ADS -->
  <div id="tab-rewards" class="tab-content">
    <div class="card">
      <div class="card-title">مركز المكافآت والإعلانات 🎁</div>
      <div class="card-desc">شاهد الإعلانات لدعم اللعبة والحصول على ذهب مضاعف لشراء كلاب نادرة!</div>
      <button class="btn btn-ad" id="btn-reward-ad" onclick="watchAdForDog()">
        مشاهدة إعلان والحصول على كلب نادِر 🐕
      </button>
    </div>
  </div>

  <!-- TAB 3: WALLET -->
  <div id="tab-wallet" class="tab-content">
    <div class="card">
      <div class="card-title">المحفظة السحابية 💎</div>
      <div class="card-desc">قم بربط محفظتك على شبكة TON لسحب المكافآت الحقيقية مستقبلاً.</div>
      <div id="ton-connect-btn" style="display: flex; justify-content: center; margin-top: 15px;"></div>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('tab-game', this)">الدمج 🎮</div>
    <div class="nav-item" onclick="switchTab('tab-rewards', this)">المكافآت 🎁</div>
    <div class="nav-item" onclick="switchTab('tab-wallet', this)">المحفظة 💎</div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // Telegram WebApp Setup
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Dog Types & Incomes
    const DOG_DATA = {
      1: { name: "جرو صغير", icon: "🐶", income: 1 },
      2: { name: "كلب عادي", icon: "🐕", income: 3 },
      3: { name: "كلب حراسة", icon: "🦮", income: 8 },
      4: { name: "كلب بوليسي", icon: "🐕‍🦺", income: 20 },
      5: { name: "كلب بيتبول", icon: "🐩", income: 50 },
      6: { name: "ذئب صائد", icon: "🐺", income: 120 },
      7: { name: "ثعلب ذهبي", icon: "🦊", income: 300 },
      8: { name: "أسد الأسطورة", icon: "🦁", income: 800 }
    };

    // Game State
    let coins = parseInt(localStorage.getItem('dog_coins')) || 200;
    let buyPrice = parseInt(localStorage.getItem('dog_buyPrice')) || 50;
    let gridSlots = JSON.parse(localStorage.getItem('dog_grid')) || [1, 1, 0, 0, 0, 0, 0, 0, 0];
    let selectedSlotIndex = null;

    // Adsgram Controller
    const ADSGRAM_BLOCK_ID = "46894";
    let AdController = null;
    if (window.Adsgram) {
      AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
    }

    // Toast Notification
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2800);
    }

    // Tab Switching
    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      el.classList.add('active');
    }

    // Calculate Total Income/sec
    function getIncomePerSec() {
      let total = 0;
      gridSlots.forEach(lvl => {
        if (lvl > 0 && DOG_DATA[lvl]) {
          total += DOG_DATA[lvl].income;
        }
      });
      return total;
    }

    // Render Grid UI
    function renderGrid() {
      const gridContainer = document.getElementById('grid');
      gridContainer.innerHTML = '';

      gridSlots.forEach((level, idx) => {
        const slot = document.createElement('div');
        slot.className = `grid-slot ${selectedSlotIndex === idx ? 'selected' : ''}`;
        slot.onclick = () => handleSlotClick(idx);

        if (level > 0 && DOG_DATA[level]) {
          slot.innerHTML = `
            <div class="dog-icon">${DOG_DATA[level].icon}</div>
            <div class="dog-level">مستوى ${level}</div>
          `;
        }

        gridContainer.appendChild(slot);
      });

      // Update Header Text
      document.getElementById('coin-balance').innerText = Math.floor(coins);
      document.getElementById('sec-income').innerText = `+${getIncomePerSec()}/ثانية`;
      document.getElementById('buy-price').innerText = buyPrice;

      // Save Local Data
      localStorage.setItem('dog_coins', coins);
      localStorage.setItem('dog_buyPrice', buyPrice);
      localStorage.setItem('dog_grid', JSON.stringify(gridSlots));
    }

    // Handle Slot Click (Merge or Select)
    function handleSlotClick(index) {
      if (selectedSlotIndex === null) {
        // First selection (must be a dog slot)
        if (gridSlots[index] > 0) {
          selectedSlotIndex = index;
        }
      } else if (selectedSlotIndex === index) {
        // Unselect if clicked again
        selectedSlotIndex = null;
      } else {
        // Target slot
        const sourceLvl = gridSlots[selectedSlotIndex];
        const targetLvl = gridSlots[index];

        if (targetLvl === 0) {
          // Move dog to empty slot
          gridSlots[index] = sourceLvl;
          gridSlots[selectedSlotIndex] = 0;
          selectedSlotIndex = null;
        } else if (targetLvl === sourceLvl) {
          // Merge two dogs!
          const nextLevel = sourceLvl + 1;
          if (DOG_DATA[nextLevel]) {
            gridSlots[index] = nextLevel;
            gridSlots[selectedSlotIndex] = 0;
            selectedSlotIndex = null;
            showToast(`🎉 تم دمج الكلاب ونمت إلى مستوى ${nextLevel}!`);
          } else {
            showToast("🌟 لقد وصلت للحد الأقصى من مستويات الكلاب!");
            selectedSlotIndex = null;
          }
        } else {
          // Select the new slot instead
          selectedSlotIndex = index;
        }
      }
      renderGrid();
    }

    // Buy Level 1 Dog
    function buyDog() {
      const emptyIdx = gridSlots.indexOf(0);
      if (emptyIdx === -1) {
        showToast("⚠️ لا توجد خانات فارغة! قم بدمج الكلاب أولاً.");
        return;
      }

      if (coins >= buyPrice) {
        coins -= buyPrice;
        gridSlots[emptyIdx] = 1; // Add Level 1 Dog
        buyPrice = Math.floor(buyPrice * 1.3); // Increase cost
        renderGrid();
        showToast("🐶 تم شراء كلب جديد بنجاح!");
      } else {
        showToast("❌ رصيدك من الذهب غير كافٍ!");
      }
    }

    // Watch Ad for 500 Coins
    function watchAdForCoins() {
      if (!AdController) {
        showToast("⚠️ جاري تهيئة الإعلانات، حاول مجدداً...");
        return;
      }

      AdController.show().then(() => {
        coins += 500;
        renderGrid();
        showToast("🎁 تم مشاهدة الإعلان! أضيفت +500 قطعة ذهبية.");
      }).catch(() => {
        showToast("⚠️ لم تكتمل مشاهدة الإعلان.");
      });
    }

    // Watch Ad for Free Dog
    function watchAdForDog() {
      const emptyIdx = gridSlots.indexOf(0);
      if (emptyIdx === -1) {
        showToast("⚠️ لا توجد خانة فارغة للحصول على الكلب!");
        return;
      }

      if (!AdController) {
        showToast("⚠️ جاري تهيئة الإعلانات، حاول مجدداً...");
        return;
      }

      AdController.show().then(() => {
        gridSlots[emptyIdx] = 2; // Level 2 dog reward
        renderGrid();
        showToast("🎁 رائع! حصلت على كلب من المستوى 2 مجاناً!");
      }).catch(() => {
        showToast("⚠️ لم تكتمل مشاهدة الإعلان.");
      });
    }

    // Game Loop (Coins Generation Every Second)
    setInterval(() => {
      const inc = getIncomePerSec();
      if (inc > 0) {
        coins += inc;
        document.getElementById('coin-balance').innerText = Math.floor(coins);
        localStorage.setItem('dog_coins', coins);
      }
    }, 1000);

    // Initialize TonConnect UI
    if (window.TON_CONNECT_UI) {
      new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: 'https://Ibrahimizzeldin.github.io/proai-app/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-btn'
      });
    }

    // First Load
    renderGrid();
  </script>
</body>
</html>
